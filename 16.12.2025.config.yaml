  - 'GEOIP,CONTABO,PROXY FAILOVER'
  - 'GEOIP,DIGITALOCEAN,PROXY FAILOVER'
  - 'GEOIP,DISCORD,PROXY FAILOVER' # VLESS PROXY' # drover-v0.8
  - 'GEOIP,FASTLY,PROXY FAILOVER'
  - 'GEOIP,GCORE,PROXY FAILOVER'
  # - 'GEOIP,GOOGLE,PROXY FAILOVER'
  - 'GEOIP,HETZNER,PROXY FAILOVER'
  - 'GEOIP,LINODE,PROXY FAILOVER'
